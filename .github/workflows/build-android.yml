
name: Build HASINI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASINI_GRANITE_ANDROID_PROJECT_READY.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project ZIP
        run: |
          mkdir -p android-project
          unzip -o HASINI_GRANITE_ANDROID_PROJECT_READY.zip -d android-project
          find android-project -maxdepth 3 -type f

      - name: Build Debug APK
        run: gradle --no-daemon -p android-project assembleDebug

      - name: Find APK
        run: find android-project -type f -name '*.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASINI-GRANITE-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
