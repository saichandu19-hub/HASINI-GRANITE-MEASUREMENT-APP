
name: Build HASINI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Extract Android project ZIP
        run: |
          mkdir -p android-project
          unzip -o HASINI_GRANITE_ANDROID_PROJECT_READY.zip -d android-project
          ls -la android-project
      - name: Build Debug APK
        run: gradle --no-daemon -p app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASINI-GRANITE-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
