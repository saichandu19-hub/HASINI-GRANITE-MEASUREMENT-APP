
name: Build HASINI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'HASINI_GRANITE_ANDROID_PROJECT_READY.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p android-project
          unzip -o HASINI_GRANITE_ANDROID_PROJECT_READY.zip -d android-project
          echo "Extracted project files:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Set target SDK to 35
        shell: bash
        run: |
          set -e
          find android-project -type f -name 'build.gradle' -exec sed -i 's/targetSdk 28/targetSdk 35/g' {} +
          find android-project -type f -name 'build.gradle.kts' -exec sed -i 's/targetSdk = 28/targetSdk = 35/g' {} +
          echo "Target SDK configuration:"
          grep -R -n 'targetSdk' android-project --include='build.gradle' --include='build.gradle.kts'

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd android-project
          gradle --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          find android-project -type f -name '*.apk' -print
          test -n "$(find android-project -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HASINI-GRANITE-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
